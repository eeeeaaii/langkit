<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LangKit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1><a href="#">LangKit</a><span id="crumb"></span></h1>
  </header>

  <main id="home" hidden>
    <section class="card">
      <h2>Create a language</h2>
      <form id="create-form">
        <input id="lang-name" placeholder="Language name, e.g. Klingon" aria-label="Language name" required autocomplete="off">
        <button class="primary" type="submit">Create</button>
      </form>
    </section>
    <section id="lang-list-section" hidden>
      <h2>Your languages</h2>
      <ul id="lang-list"></ul>
    </section>
  </main>

  <main id="sheet-view" hidden>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="phrases">Phrases</button>
      <button role="tab" data-tab="phonology">Phonology</button>
      <button role="tab" data-tab="lexicon">Lexicon</button>
      <button role="tab" data-tab="inflection">Inflection</button>
      <button role="tab" data-tab="inflection-types">Inflection Types</button>
    </nav>
    <section id="tab-phrases" class="tab-panel" role="tabpanel">
      <div id="phrases-table"></div>
    </section>
    <section id="tab-phonology" class="tab-panel" role="tabpanel" hidden>
      <h3>Consonants</h3>
      <div id="consonants-table"></div>
      <h3>Vowels</h3>
      <div id="vowels-table"></div>
      <h3>Diphthongs</h3>
      <div id="diphthongs-table"></div>
    </section>
    <section id="tab-lexicon" class="tab-panel" role="tabpanel" hidden>
      <div id="lexicon-table"></div>
    </section>
    <section id="tab-inflection" class="tab-panel" role="tabpanel" hidden>
      <div id="inflections-table"></div>
    </section>
    <section id="tab-inflection-types" class="tab-panel" role="tabpanel" hidden>
      <div id="inflectionTypes-table"></div>
    </section>
  </main>

  <script src="store.js"></script>
  <script src="ipa.js"></script>
  <script src="audio.js"></script>
  <script src="parse.js"></script>
  <script src="picker.js"></script>
  <script src="sheet.js"></script>
  <script src="app.js"></script>
</body>
</html>
