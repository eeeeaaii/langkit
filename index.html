<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LangKit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1><a href="#">LangKit</a><span id="crumb"></span></h1>
  </header>

  <main id="home" hidden>
    <section class="card">
      <h2>Create a language</h2>
      <form id="create-form">
        <input id="lang-name" placeholder="Language name, e.g. Klingon" aria-label="Language name" required autocomplete="off">
        <button class="primary" type="submit">Create</button>
      </form>
    </section>
    <section id="lang-list-section" hidden>
      <h2>Your languages</h2>
      <ul id="lang-list"></ul>
    </section>
  </main>

  <main id="sheet-view" hidden>
    <table id="sheet">
      <thead></thead>
      <tbody></tbody>
    </table>
  </main>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
